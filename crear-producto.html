<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Crear Producto</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <header>
    <h1>Crear Producto</h1>
    <a href="index.html" class="boton-volver">← Volver</a>
  </header>

  <main>
    <form id="formulario-crear-producto" class="formulario">
      <label>Nombre: <input type="text" name="nombre" required /></label>
      <label>Fecha de creación: <input type="date" name="fechaCreacion" required /></label>
      <label>Fecha de utilidad: <input type="date" name="fechaUtilidad" required /></label>
      <label>Wikipedia (URL): <input type="url" name="wiki" required /></label>
      <label>Imagen (URL): <input type="url" name="imagen" required /></label>
      <button type="submit">Guardar Producto</button>
    </form>

  </main>


  <script>
    const formulario = document.getElementById("formulario-crear-producto");

    formulario.addEventListener("submit", async function (e) {
      e.preventDefault();

      const formData = new FormData(formulario);
      const token = localStorage.getItem("accessToken");

      const nuevoProducto = {
        name: formData.get("nombre"),
        birthDate: formData.get("fechaCreacion"),
        deathDate: formData.get("fechaUtilidad"),
        imageUrl: formData.get("imagen"),
        wikiUrl: formData.get("wiki"),
        url: ""  //No requerido
      };

      console.log("➡️ Enviando producto:", nuevoProducto);

      try {
        const response = await fetch("http://127.0.0.1:8000/api/v1/products", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify(nuevoProducto)
        });

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(errorText);
        }

        alert("Producto creado correctamente.");
        window.location.href = "index.html";
      } catch (error) {
        alert("Error al crear el producto.");
        console.error(error);
      }
    });
  </script>
</body>

</html>
