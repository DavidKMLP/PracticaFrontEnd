<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Crear Producto</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .formulario {
      max-width: 600px;
      margin: 2rem auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background-color: #2e3b3b;
      padding: 2rem;
      border-radius: 10px;
    }

    .formulario label {
      display: flex;
      flex-direction: column;
      font-weight: bold;
      color: #fff;
    }

    .formulario input {
      padding: 0.5rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 5px;
      margin-top: 0.5rem;
    }

    .formulario button {
      padding: 0.7rem;
      font-size: 1rem;
      background-color: #8b86ff;
      color: #1a1a1a;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .formulario button:hover {
      background-color: #a5a1ff;
    }
  </style>
</head>

<body>
  <header>
    <h1>Crear Producto</h1>
    <a href="index.html" class="boton-volver">← Volver</a>
  </header>

  <main>
    <form id="formulario-crear-producto" class="formulario">
      <label>Nombre: <input type="text" name="nombre" required /></label>
      <label>Fecha de creación: <input type="text" name="fechaCreacion" required /></label>
      <label>Fecha de utilidad: <input type="text" name="fechaUtilidad" required /></label>
      <label>Wikipedia (URL): <input type="url" name="wiki" required /></label>
      <label>Personas (separadas por coma): <input type="text" name="personas" /></label>
      <label>Entidades (separadas por coma): <input type="text" name="entidades" /></label>
      <label>Imagen del producto (.jpg o .png):
        <input type="file" name="imagen" accept=".jpg, .jpeg, .png" required />
      </label>
      <button type="submit">Guardar Producto</button>
    </form>
  </main>

  <script src="js/datos.js"></script>
  <script>
    const formulario = document.getElementById("formulario-crear-producto");

    formulario.addEventListener("submit", function (e) {
      e.preventDefault();

      const formData = new FormData(formulario);
      const archivoImagen = formData.get("imagen");

      if (!archivoImagen || !archivoImagen.type.startsWith("image/")) {
        alert("Por favor, selecciona una imagen válida (JPG o PNG).");
        return;
      }

      const reader = new FileReader();
      reader.onload = function () {
        const imagenBase64 = reader.result;

        const nuevoProducto = {
          nombre: formData.get("nombre"),
          fechaCreacion: formData.get("fechaCreacion"),
          fechaUtilidad: formData.get("fechaUtilidad"),
          wiki: formData.get("wiki"),
          imagen: imagenBase64,
          personas: formData.get("personas")?.split(',').map(p => p.trim()).filter(Boolean) || [],
          entidades: formData.get("entidades")?.split(',').map(e => e.trim()).filter(Boolean) || []
        };

        const productos = ServicioDatos.obtenerProductos();
        productos.push(nuevoProducto);
        ServicioDatos.guardarProductos(productos);

        alert("Producto creado correctamente.");
        window.location.href = "index.html";
      };

      reader.readAsDataURL(archivoImagen);
    });
  </script>
</body>
</html>
