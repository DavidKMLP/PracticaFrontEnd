<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Detalle del Científico</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <header>
    <h1>Anales de la Ciencia</h1>
    <a href="index.html" class="boton-volver">← Volver</a>
  </header>

  <main class="pagina-producto" id="detalle-cientifico"></main>

  <script src="js/datosCentralizados.js"></script>
  <script src="js/navegacion.js"></script>
  <script>
    let cientifico = null;

    async function mostrarCientifico() {
      cientifico = await DatosApp.obtenerCientificoSeleccionado();
      const contenedor = document.getElementById('detalle-cientifico');
      const sesion = JSON.parse(localStorage.getItem("usuarioLogueado"));
      const puedeEditar = sesion?.rol === "escritor";

      if (!cientifico) {
        contenedor.innerHTML = "<p>Científico no encontrado.</p>";
        return;
      }

      contenedor.innerHTML = `
        <header class="cabecera-wiki">
          <h1 class="titulo-wiki">${cientifico.nombre}</h1>
          <img src="${cientifico.imagen}" alt="${cientifico.nombre}" class="imagen-wiki" />
          ${puedeEditar ? `<button class="boton-editar" onclick="editarCientificoDesdeVista()">Editar datos</button>` : ""}
        </header>

        <section class="descripcion-wiki">
          <p class="intro-wiki">${cientifico.intro || ''}</p>
        </section>

        <section class="datos-wiki">
          <table>
            <tr><th>Fecha de nacimiento</th><td>${cientifico.fechaCreacion}</td></tr>
            <tr><th>Fecha de fallecimiento</th><td>${cientifico.fechaUtilidad}</td></tr>
            <tr><th>Wiki</th><td><a href="${cientifico.wiki}" target="_blank">Ver en Wikipedia</a></td></tr>
          </table>
        </section>

        <section class="relacionados">
          <h2>Entidades Relacionadas</h2>
          <div class="cuadricula-datos" id="entidades-relacionadas"></div>

          <h2>Productos Relacionados</h2>
          <div class="cuadricula-datos" id="productos-relacionados"></div>
        </section>
      `;

      const entidades = await DatosApp.obtenerEntidades();
      const productos = await DatosApp.obtenerProductos();
      const contEntidades = document.getElementById('entidades-relacionadas');
      const contProductos = document.getElementById('productos-relacionados');

      if (cientifico.entidades?.length > 0) {
        cientifico.entidades.forEach(nombre => {
          const entidad = entidades.find(e => e.nombre === nombre);
          if (entidad) {
            const div = document.createElement("div");
            div.className = "elemento-datos";
            div.innerHTML = `
              <img src="${entidad.imagen}" alt="${entidad.nombre}" />
              <a href="entidad.html" onclick="verEntidad('${entidad.nombre}')">${entidad.nombre}</a>
            `;
            contEntidades.appendChild(div);
          }
        });
      } else {
        contEntidades.innerHTML = "<p>No hay entidades relacionadas.</p>";
      }

      const relacionados = productos.filter(p => p.personas?.includes(cientifico.nombre));
      if (relacionados.length > 0) {
        relacionados.forEach(p => {
          const div = document.createElement("div");
          div.className = "elemento-datos";
          div.innerHTML = `
            <img src="${p.imagen}" alt="${p.nombre}" />
            <a href="producto.html" onclick="verProducto('${p.nombre}')">${p.nombre}</a>
          `;
          contProductos.appendChild(div);
        });
      } else {
        contProductos.innerHTML = "<p>No hay productos relacionados.</p>";
      }
    }

    function editarCientificoDesdeVista() {
      localStorage.setItem("cientificoEditando", cientifico.nombre);
      window.location.href = "editar-cientifico.html";
    }

    mostrarCientifico();
  </script>
  <footer class="footer-ejemplo">
    <h2>Proyecto Front End David Lew Pérez 2025</h2>
  </footer>
</body>
</html>
