<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Detalle del Científico</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <header>
    <h1>Anales de la Ciencia</h1>
    <a href="index.html" class="boton-volver">← Volver</a>
  </header>

  <main class="pagina-producto" id="detalle-cientifico"></main>

  <script src="js/navegacion.js"></script>
  <script>
    let cientifico = null;

    // Modificado para la implementacion de la api
    async function mostrarCientifico() {
      cientifico = await obtenerCientificoDesdeAPI();
      const contenedor = document.getElementById('detalle-cientifico');
      const puedeEditar = localStorage.getItem("userRol") === "writer";

      if (!cientifico) {
        contenedor.innerHTML = "<p>Científico no encontrado.</p>";
        return;
      }

      contenedor.innerHTML = `
        <header class="cabecera-wiki">
          <h1 class="titulo-wiki">${cientifico.name}</h1>
          <img src="${cientifico.imageUrl}" alt="${cientifico.name}" class="imagen-wiki" />
          ${puedeEditar ? `<button class="boton-editar" onclick="editarCientificoDesdeVista()">Editar datos</button>` : ""}
        </header>

        <section class="datos-wiki">
          <table>
            <tr><th>Fecha de nacimiento</th><td>${cientifico.birthDate}</td></tr>
            <tr><th>Fecha de fallecimiento</th><td>${cientifico.deathDate}</td></tr>
            <tr><th>Wiki</th><td><a href="${cientifico.wikiUrl}" target="_blank">Ver en Wikipedia</a></td></tr>
          </table>
        </section>

        <section class="relacionados">
          <h2>Entidades Relacionadas</h2>
          <div class="cuadricula-datos" id="entidades-relacionadas"></div>

          <h2>Productos Relacionados</h2>
          <div class="cuadricula-datos" id="productos-relacionados"></div>
        </section>
      `;
    }

    // Modificado para la implementacion de la api
    async function obtenerCientificoDesdeAPI() {
      const id = localStorage.getItem("cientificoSeleccionadoId");
      if (!id) return null;

      const response = await fetch(`http://127.0.0.1:8000/api/v1/persons/${id}`);
      if (!response.ok) {
        console.error("Error al obtener el científico por ID");
        return null;
      }

      const result = await response.json();
      return result.person;
    }

    function editarCientificoDesdeVista() {
      localStorage.setItem("cientificoEditando", cientifico.name);
      window.location.href = "editar-cientifico.html";
    }

    mostrarCientifico();
  </script>

  <footer class="footer-ejemplo">
    <h2>Proyecto Front End David Lew Pérez 2025</h2>
  </footer>
</body>

</html>
