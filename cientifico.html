<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Detalle del Científico</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <header>
    <h1>Anales de la Ciencia</h1>
    <a href="index.html" class="boton-volver">← Volver</a>
  </header>

  <main class="pagina-producto" id="detalle-cientifico"></main>

  <script src="js/navegacion.js"></script>
  <script>
    let cientifico = null;

    // Modificado para la implementacion de la api
    async function mostrarCientifico() {
      cientifico = await obtenerCientificoDesdeAPI();
      const contenedor = document.getElementById('detalle-cientifico');
      const puedeEditar = localStorage.getItem("userRol") === "writer";

      if (!cientifico) {
        contenedor.innerHTML = "<p>Científico no encontrado.</p>";
        return;
      }

      contenedor.innerHTML = `
        <header class="cabecera-wiki">
          <h1 class="titulo-wiki">${cientifico.name}</h1>
          <img src="${cientifico.imageUrl}" alt="${cientifico.name}" class="imagen-wiki" />
          ${puedeEditar ? `
          <div style="display: flex; flex-direction: column; gap: 0.5rem;">
          <button class="boton-editar" onclick="editarCientificoDesdeVista()">Editar datos</button>
          <button class="boton-editar" onclick="editarRelacionesCientifico()">Editar relaciones</button>
          </div>
          ` : ""}
        </header>

        <section class="datos-wiki">
          <table>
            <tr><th>Fecha de nacimiento</th><td>${cientifico.birthDate}</td></tr>
            <tr><th>Fecha de fallecimiento</th><td>${cientifico.deathDate}</td></tr>
            <tr><th>Wiki</th><td><a href="${cientifico.wikiUrl}" target="_blank">Ver en Wikipedia</a></td></tr>
          </table>
        </section>

        <section class="relacionados">
          <h2>Entidades Relacionadas</h2>
          <div class="cuadricula-datos" id="entidades-relacionadas"></div>

          <h2>Productos Relacionados</h2>
          <div class="cuadricula-datos" id="productos-relacionados"></div>
        </section>
      `;
        
      // Renderizar productos relacionados
      if (cientifico.products?.length > 0) {
        cientifico.products.forEach(renderizarProductoRelacionado);
      }

      // Renderizar entidades relacionadas
      if (cientifico.entities?.length > 0) {
        cientifico.entities.forEach(renderizarEntidadRelacionada);
      }

    }

    // Modificado para la implementacion de la api
    async function obtenerCientificoDesdeAPI() {
      const id = localStorage.getItem("cientificoSeleccionadoId");
      if (!id) return null;

      const response = await fetch(`http://127.0.0.1:8000/api/v1/persons/${id}`);
      if (!response.ok) {
        console.error("Error al obtener el científico por ID");
        return null;
      }

      const result = await response.json();
      return result.person;
    }

    function editarCientificoDesdeVista() {
      localStorage.setItem("cientificoEditando", cientifico.name);
      window.location.href = "editar-cientifico.html";
    }

    function editarRelacionesCientifico() {
      localStorage.setItem("cientificoSeleccionadoId", cientifico.id);
      window.location.href = "editar-relaciones-cientifico.html";
    }


    mostrarCientifico();

    function verEntidad(id) {
      localStorage.setItem("entidadSeleccionada", id);
    }

    function verProducto(id) {
      localStorage.setItem("productoSeleccionado", id);
    }

    async function renderizarEntidadRelacionada(id) {
      try {
        const res = await fetch(`http://127.0.0.1:8000/api/v1/entities/${id}`);
        const data = await res.json();
        const entidad = data.entity;

        const div = document.createElement("div");
        div.className = "elemento-datos";
        div.innerHTML = `
      <img src="${entidad.imageUrl || 'img/default.jpg'}" alt="${entidad.name}" />
      <a href="entidad.html" onclick="verEntidad(${entidad.id})">${entidad.name}</a>
    `;
        document.getElementById("entidades-relacionadas").appendChild(div);
      } catch (error) {
        console.error(`Error al cargar entidad ID ${id}:`, error);
      }
    }

    async function renderizarProductoRelacionado(id) {
      try {
        const res = await fetch(`http://127.0.0.1:8000/api/v1/products/${id}`);
        const data = await res.json();
        const producto = data.product;

        const div = document.createElement("div");
        div.className = "elemento-datos";
        div.innerHTML = `
      <img src="${producto.imageUrl || 'img/default.jpg'}" alt="${producto.name}" />
      <a href="producto.html" onclick="verProducto(${producto.id})">${producto.name}</a>
    `;
        document.getElementById("productos-relacionados").appendChild(div);
      } catch (error) {
        console.error(`Error al cargar producto ID ${id}:`, error);
      }
    }

  </script>

  <footer class="footer-ejemplo">
    <h2>Proyecto Front End David Lew Pérez 2025</h2>
  </footer>
</body>

</html>
