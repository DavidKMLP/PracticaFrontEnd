<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Detalle del Científico</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <header>
    <h1>Anales de la Ciencia</h1>
    <a href="index.html" class="boton-volver">← Volver</a>
  </header>

  <main class="pagina-producto" id="detalle-cientifico"></main>

  <script src="js/datos.js"></script>
  <script src="js/navegacion.js"></script>
  <script>
    const cientifico = ServicioDatos.obtenerCientificoSeleccionado();

    if (!cientifico) {
      document.getElementById('detalle-cientifico').innerHTML = "<p>Científico no encontrado.</p>";
    } else {
      document.getElementById('detalle-cientifico').innerHTML = `
        <header class="cabecera-wiki">
          <h1 class="titulo-wiki">${cientifico.nombre}</h1>
          <img src="${cientifico.imagen}" alt="${cientifico.nombre}" class="imagen-wiki" />
        </header>

        <section class="descripcion-wiki">
          <p class="intro-wiki">${cientifico.intro}</p>
        </section>

        <section class="datos-wiki">
          <table>
            <tr><th>Fecha de nacimiento</th><td>${cientifico.fechaCreacion}</td></tr>
            <tr><th>Fecha de fallecimiento</th><td>${cientifico.fechaUtilidad}</td></tr>
            <tr><th>Wiki</th><td><a href="${cientifico.wiki}" target="_blank">Ver en Wikipedia</a></td></tr>
          </table>
        </section>

        <section class="relaciones-wiki">
          <h3>Entidades relacionadas</h3>
          <div class="cuadricula-datos" id="entidades-relacionadas"></div>
        </section>

        <section class="relaciones-wiki">
          <h3>Productos relacionados</h3>
          <div class="cuadricula-datos" id="productos-relacionados"></div>
        </section>
      `;

      // Entidades relacionadas
      const contenedorEntidades = document.getElementById('entidades-relacionadas');

      if (cientifico.entidades && cientifico.entidades.length > 0) {
        cientifico.entidades.forEach(nombre => {
          const entidad = ServicioDatos.obtenerEntidadPorNombre(nombre);
          if (entidad) {
            const div = document.createElement('div');
            div.className = 'elemento-datos';
            div.innerHTML = `
              <img src="${entidad.imagen}" alt="${entidad.nombre}">
              <a href="#" onclick="verEntidad('${entidad.nombre}')">${entidad.nombre}</a>
            `;
            contenedorEntidades.appendChild(div);
          }
        });
      } else {
        contenedorEntidades.innerHTML = "<p>No hay entidades relacionadas con este científico.</p>";
      }

      // Productos relacionados
      const contenedorProductos = document.getElementById('productos-relacionados');
      const productos = ServicioDatos.obtenerProductos();
      const relacionados = productos.filter(p => p.personas?.includes(cientifico.nombre));

      if (relacionados.length > 0) {
        relacionados.forEach(producto => {
          const div = document.createElement('div');
          div.className = 'elemento-datos';
          div.innerHTML = `
            <img src="${producto.imagen}" alt="${producto.nombre}">
            <a href="#" onclick="verProducto('${producto.nombre}')">${producto.nombre}</a>
          `;
          contenedorProductos.appendChild(div);
        });
      } else {
        contenedorProductos.innerHTML = "<p>No hay productos relacionados con este científico.</p>";
      }
    }
  </script>
</body>
</html>
