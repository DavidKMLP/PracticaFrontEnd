<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Editar Entidad</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <header>
    <h1>Editar Entidad</h1>
    <a href="index.html" class="boton-volver">← Volver</a>
  </header>

  <main>
    <form id="formulario-editar-entidad" class="formulario">
      <label>Nombre: <input type="text" name="nombre" required /></label>
      <label>Fecha de creación: <input type="date" name="fechaCreacion" required /></label>
      <label>Fecha de utilidad: <input type="date" name="fechaUtilidad" required /></label>
      <label>Wikipedia (URL): <input type="url" name="wiki" required /></label>
      <label>Imagen (URL): <input type="url" name="imagen" required /></label>
      <button type="submit">Guardar Cambios</button>
    </form>
  </main>

  <script>
    const formulario = document.getElementById("formulario-editar-entidad");
    let entidadActual = null;
    let etagEntidad = null;

    async function cargarEntidad() {
      const id = localStorage.getItem("entidadSeleccionada");
      if (!id) {
        alert("ID de la entidad no definido.");
        window.location.href = "index.html";
        return;
      }

      try {
        const response = await fetch(`http://127.0.0.1:8000/api/v1/entities/${id}`);
        if (!response.ok) throw new Error("No se pudo obtener la entidad");
        etagEntidad = response.headers.get("etag");
        const data = await response.json();
        entidadActual = data.entity;

        formulario.nombre.value = entidadActual.name;
        formulario.fechaCreacion.value = entidadActual.birthDate;
        formulario.fechaUtilidad.value = entidadActual.deathDate;
        formulario.wiki.value = entidadActual.wikiUrl;
        formulario.imagen.value = entidadActual.imageUrl || "";

      } catch (error) {
        alert("Error al cargar los datos de la entidad.");
        console.error(error);
        window.location.href = "index.html";
      }
    }

    formulario.addEventListener("submit", async function (e) {
      e.preventDefault();

      const formData = new FormData(formulario);
      const token = localStorage.getItem("accessToken");

      const actualizada = {
        name: formData.get("nombre"),
        birthDate: formData.get("fechaCreacion"),
        deathDate: formData.get("fechaUtilidad"),
        wikiUrl: formData.get("wiki"),
        imageUrl: formData.get("imagen")
      };

      try {
        const response = await fetch(`http://127.0.0.1:8000/api/v1/entities/${entidadActual.id}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`,
            "If-Match": etagEntidad
          },
          body: JSON.stringify(actualizada)
        });

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(errorText);
        }

        alert("Entidad actualizada correctamente.");
        window.location.href = "index.html";
      } catch (error) {
        alert("Error al actualizar la entidad.");
        console.error(error);
      }
    });

    cargarEntidad();
  </script>

  <footer class="footer-ejemplo">
    <h2>Proyecto Front End David Lew Pérez 2025</h2>
  </footer>
</body>

</html>
