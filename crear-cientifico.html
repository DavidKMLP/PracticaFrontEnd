<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Crear Científico</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header>
    <h1>Crear Científico</h1>
    <a href="index.html" class="boton-volver">← Volver</a>
  </header>

  <main>
    <form id="formulario-crear-cientifico" class="formulario">
      <label>Nombre: <input type="text" name="nombre" required /></label>
      <label>Fecha de nacimiento: <input type="date" name="fechaNacimiento" required /></label>
      <label>Fecha de fallecimiento: <input type="date" name="fechaFallecimiento" required /></label>
      <label>Wikipedia (URL): <input type="url" name="wiki" required /></label>
      <label>Imagen (URL): <input type="url" name="imagen" required /></label>
      <button type="submit">Guardar Científico</button>
    </form>
  </main>

  <script>
    const formulario = document.getElementById("formulario-crear-cientifico");

    formulario.addEventListener("submit", async function (e) {
      e.preventDefault();

      const formData = new FormData(formulario);
      const token = localStorage.getItem("accessToken");

      const nuevoCientifico = {
        name: formData.get("nombre"),
        birthDate: formData.get("fechaNacimiento"),
        deathDate: formData.get("fechaFallecimiento"),
        wikiUrl: formData.get("wiki"),
        imageUrl: formData.get("imagen")
      };

      try {
        const response = await fetch("http://127.0.0.1:8000/api/v1/persons", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify(nuevoCientifico)
        });

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(errorText);
        }

        alert("Científico creado correctamente.");
        window.location.href = "index.html";
      } catch (error) {
        alert("Error al crear el científico.");
        console.error(error);
      }
    });
  </script>
</body>
</html>
