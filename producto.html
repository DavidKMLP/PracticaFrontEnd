<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Detalle del Producto</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header>
    <h1>Anales de la Ciencia</h1>
    <a href="index.html" class="boton-volver">← Volver</a>
  </header>

  <main class="pagina-producto" id="detalle-producto"></main>

  <script src="js/datos.js"></script>
  <script src="js/navegacion.js"></script>
  <script>
    const producto = ServicioDatos.obtenerProductoSeleccionado();

    if (!producto) {
      document.getElementById('detalle-producto').innerHTML = "<p>Producto no encontrado.</p>";
    } else {
      document.getElementById('detalle-producto').innerHTML = `
        <header class="cabecera-wiki">
          <h1 class="titulo-wiki">${producto.nombre}</h1>
          <img src="${producto.imagen}" alt="${producto.nombre}" class="imagen-wiki" />
        </header>

        <section class="descripcion-wiki">
          <p class="intro-wiki">${producto.intro}</p>
        </section>

        <section class="datos-wiki">
          <table>
            <tr><th>Fecha de creación</th><td>${producto.fechaCreacion}</td></tr>
            <tr><th>Fecha de utilidad</th><td>${producto.fechaUtilidad}</td></tr>
            <tr><th>Wiki</th><td><a href="${producto.wiki}" target="_blank">Ver en Wikipedia</a></td></tr>
          </table>
        </section>

        <section class="relaciones-wiki">
          <h3>Personas relacionadas</h3>
          <div class="cuadricula-datos" id="personas-relacionadas"></div>
        </section>

        <section class="relaciones-wiki">
          <h3>Entidades relacionadas</h3>
          <div class="cuadricula-datos" id="entidades-relacionadas"></div>
        </section>
      `;

      // Personas relacionadas
      const cientificos = ServicioDatos.obtenerCientificos();
      const contPersonas = document.getElementById('personas-relacionadas');

      if (producto.personas?.length > 0) {
        producto.personas.forEach(nombre => {
          const cientifico = cientificos.find(c => c.nombre === nombre);
          if (cientifico) {
            const div = document.createElement('div');
            div.className = 'elemento-datos';
            div.innerHTML = `
              <img src="${cientifico.imagen}" alt="${cientifico.nombre}">
              <a href="#" onclick="verCientifico('${cientifico.nombre}')">${cientifico.nombre}</a>
            `;
            contPersonas.appendChild(div);
          }
        });
      } else {
        contPersonas.innerHTML = "<p>No hay personas relacionadas con este producto.</p>";
      }

      // Entidades relacionadas
      const entidades = ServicioDatos.obtenerEntidades();
      const contEntidades = document.getElementById('entidades-relacionadas');

      if (producto.entidades?.length > 0) {
        producto.entidades.forEach(nombre => {
          const entidad = entidades.find(e => e.nombre === nombre);
          if (entidad) {
            const div = document.createElement('div');
            div.className = 'elemento-datos';
            div.innerHTML = `
              <img src="${entidad.imagen}" alt="${entidad.nombre}">
              <a href="#" onclick="verEntidad('${entidad.nombre}')">${entidad.nombre}</a>
            `;
            contEntidades.appendChild(div);
          }
        });
      } else {
        contEntidades.innerHTML = "<p>No hay entidades relacionadas con este producto.</p>";
      }
    }
  </script>
</body>
</html>
