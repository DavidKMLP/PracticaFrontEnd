<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Detalle del Producto</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <header>
    <h1>Anales de la Ciencia</h1>
    <a href="index.html" class="boton-volver">← Volver</a>
  </header>

  <main class="pagina-producto" id="detalle-producto"></main>

  <script src="js/navegacion.js"></script>
  <script>
    let producto = null;

    // Modificado para la implementacion de la api
    async function mostrarProducto() {
      producto = await obtenerProductoDesdeAPI();
      const contenedor = document.getElementById('detalle-producto');
      const puedeEditar = localStorage.getItem("userRol") === "writer";

      if (!producto) {
        contenedor.innerHTML = "<p>Producto no encontrado.</p>";
        return;
      }

      contenedor.innerHTML = `
        <header class="cabecera-wiki">
          <h1 class="titulo-wiki">${producto.name}</h1>
          <img src="${producto.imageUrl}" alt="${producto.name}" class="imagen-wiki" />
          ${puedeEditar ? `
            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
            <button class="boton-editar" onclick="editarProductoDesdeVista()">Editar datos</button>
            <button class="boton-editar" onclick="editarRelacionesDesdeVista()">Editar relaciones</button>
            </div>
          ` : ""}

        </header>

        <section class="datos-wiki">
          <table>
            <tr><th>Fecha de creación</th><td>${producto.birthDate}</td></tr>
            <tr><th>Fecha de utilidad</th><td>${producto.deathDate}</td></tr>
            <tr><th>Wiki</th><td><a href="${producto.wikiUrl}" target="_blank">Ver en Wikipedia</a></td></tr>
          </table>
        </section>

        <section class="relacionados">
          <h2>Científicos Relacionados</h2>
          <div class="cuadricula-datos" id="cientificos-relacionados"></div>
  
          <h2>Entidades Relacionadas</h2>
          <div class="cuadricula-datos" id="entidades-relacionadas"></div>
        </section>
      `;
      // Mostrar científicos/personas relacionados
      if (producto.persons?.length > 0) {
        producto.persons.forEach(cargarRelacionPersona);
      }

      // Mostrar entidades relacionadas
      if (producto.entities?.length > 0) {
        producto.entities.forEach(cargarRelacionEntidad);
      }

    }

    // Modificado para la implementacion de la api
    async function obtenerProductoDesdeAPI() {
      const id = localStorage.getItem("productoSeleccionado");
      if (!id) return null;

      const response = await fetch(`http://127.0.0.1:8000/api/v1/products/${id}`);
      if (!response.ok) {
        console.error("Error al obtener el producto por ID");
        return null;
      }

      const result = await response.json();
      return result.product;
    }

    function editarProductoDesdeVista() {
      localStorage.setItem("productoEditando", producto.name);
      localStorage.setItem("productoEditandoId", producto.id);
      window.location.href = "editar-producto.html";
    }

    //Nuevo formulario
    function editarRelacionesDesdeVista() {
      localStorage.setItem("relacionTipo", "product");
      localStorage.setItem("relacionId", producto.id);
      window.location.href = "editar-relaciones.html";
    }

    mostrarProducto();

    function verEntidad(id) {
      localStorage.setItem("entidadSeleccionada", id);
    }

    function verCientifico(id) {
      localStorage.setItem("cientificoSeleccionadoId", id);
    }

    async function cargarRelacionPersona(id) {
      try {
        const response = await fetch(`http://127.0.0.1:8000/api/v1/persons/${id}`);
        const data = await response.json();
        const persona = data.person;

        const div = document.createElement("div");
        div.className = "elemento-datos";
        div.innerHTML = `
      <img src="${persona.imageUrl || 'img/default.jpg'}" alt="${persona.name}" />
      <a href="cientifico.html" onclick="verCientifico(${persona.id})">${persona.name}</a>
    `;
        document.getElementById("cientificos-relacionados").appendChild(div);
      } catch (error) {
        console.error(`Error al cargar persona ID ${id}:`, error);
      }
    }

    async function cargarRelacionEntidad(id) {
      try {
        const response = await fetch(`http://127.0.0.1:8000/api/v1/entities/${id}`);
        const data = await response.json();
        const entidad = data.entity;

        const div = document.createElement("div");
        div.className = "elemento-datos";
        div.innerHTML = `
      <img src="${entidad.imageUrl || 'img/default.jpg'}" alt="${entidad.name}" />
      <a href="entidad.html" onclick="verEntidad(${entidad.id})">${entidad.name}</a>
    `;
        document.getElementById("entidades-relacionadas").appendChild(div);
      } catch (error) {
        console.error(`Error al cargar entidad ID ${id}:`, error);
      }
    }

  </script>

  <footer class="footer-ejemplo">
    <h2>Proyecto Front End David Lew Pérez 2025</h2>
  </footer>
</body>

</html>
