<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Detalle del Producto</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header>
    <h1>Anales de la Ciencia</h1>
    <a href="index.html" class="boton-volver">← Volver</a>
  </header>

  <main class="pagina-producto" id="detalle-producto"></main>

  <script src="js/datosCentralizados.js"></script>
  <script src="js/navegacion.js"></script>
  <script>
    async function mostrarProducto() {
      const producto = await DatosApp.obtenerProductoSeleccionado();
      const contenedor = document.getElementById('detalle-producto');

      if (!producto) {
        contenedor.innerHTML = "<p>Producto no encontrado.</p>";
        return;
      }

      contenedor.innerHTML = `
        <header class="cabecera-wiki">
          <h1 class="titulo-wiki">${producto.nombre}</h1>
          <img src="${producto.imagen}" alt="${producto.nombre}" class="imagen-wiki" />
        </header>

        <section class="descripcion-wiki">
          <p class="intro-wiki">${producto.intro || ''}</p>
        </section>

        <section class="datos-wiki">
          <table>
            <tr><th>Fecha de creación</th><td>${producto.fechaCreacion}</td></tr>
            <tr><th>Fecha de utilidad</th><td>${producto.fechaUtilidad}</td></tr>
            <tr><th>Wiki</th><td><a href="${producto.wiki}" target="_blank">Ver en Wikipedia</a></td></tr>
          </table>
        </section>

        <section class="relacionados">
          <h2>Científicos Relacionados</h2>
          <div class="cuadricula-datos" id="cientificos-relacionados"></div>

          <h2>Entidades Relacionadas</h2>
          <div class="cuadricula-datos" id="entidades-relacionadas"></div>
        </section>
      `;

      const cientificos = await DatosApp.obtenerCientificos();
      const entidades = await DatosApp.obtenerEntidades();

      const contCientificos = document.getElementById('cientificos-relacionados');
      const contEntidades = document.getElementById('entidades-relacionadas');

      if (producto.personas?.length > 0) {
        producto.personas.forEach(nombre => {
          const c = cientificos.find(ci => ci.nombre === nombre);
          if (c) {
            const div = document.createElement('div');
            div.className = 'elemento-datos';
            div.innerHTML = `
              <img src="${c.imagen}" alt="${c.nombre}">
              <a href="cientifico.html" onclick="verCientifico('${c.nombre}')">${c.nombre}</a>
            `;
            contCientificos.appendChild(div);
          }
        });
      } else {
        contCientificos.innerHTML = "<p>No hay científicos relacionados.</p>";
      }

      if (producto.entidades?.length > 0) {
        producto.entidades.forEach(nombre => {
          const e = entidades.find(ent => ent.nombre === nombre);
          if (e) {
            const div = document.createElement('div');
            div.className = 'elemento-datos';
            div.innerHTML = `
              <img src="${e.imagen}" alt="${e.nombre}">
              <a href="entidad.html" onclick="verEntidad('${e.nombre}')">${e.nombre}</a>
            `;
            contEntidades.appendChild(div);
          }
        });
      } else {
        contEntidades.innerHTML = "<p>No hay entidades relacionadas.</p>";
      }
    }

    mostrarProducto();
  </script>
</body>
</html>
