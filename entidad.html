<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Detalle de la Entidad</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header>
    <h1>Anales de la Ciencia</h1>
    <a href="index.html" class="boton-volver">← Volver</a>
  </header>

  <main class="pagina-producto" id="detalle-entidad"></main>

  <script src="js/datos.js"></script>
  <script>
    const entidad = ServicioDatos.obtenerEntidadSeleccionada();

    if (!entidad) {
      document.getElementById('detalle-entidad').innerHTML = "<p>Entidad no encontrada.</p>";
    } else {
      document.getElementById('detalle-entidad').innerHTML = `
        <div class="contenido-producto">
          <img src="${entidad.imagen}" alt="${entidad.nombre}" class="imagen-detalle" />
          <h2>${entidad.nombre}</h2>
          <p><strong>Fecha de creación:</strong> ${entidad.fechaCreacion}</p>
          <p><strong>Fecha de utilidad:</strong> ${entidad.fechaUtilidad}</p>
          <p><strong>Wiki:</strong> <a href="${entidad.wiki}" target="_blank">Ver en Wikipedia</a></p>

          <section class="seccion-datos" id="cientificos-relacionados">
            <h3>Científicos relacionados</h3>
            <div class="cuadricula-datos"></div>
          </section>

          <section class="seccion-datos" id="productos-relacionados">
            <h3>Productos relacionados</h3>
            <div class="cuadricula-datos"></div>
          </section>
        </div>
      `;

      // Mostrar científicos relacionados
      const cientificos = ServicioDatos.obtenerCientificos();
      const contCientificos = document.querySelector('#cientificos-relacionados .cuadricula-datos');
      const relacionadosC = cientificos.filter(c => c.entidades?.includes(entidad.nombre));

      if (relacionadosC.length > 0) {
        relacionadosC.forEach(c => {
          const div = document.createElement('div');
          div.className = 'elemento-datos';
          div.innerHTML = `
            <img src="${c.imagen}" alt="${c.nombre}">
            <a href="cientifico.html" onclick="verCientifico('${c.nombre}')">${c.nombre}</a>
          `;
          contCientificos.appendChild(div);
        });
      } else {
        contCientificos.innerHTML = "<p>No hay científicos relacionados.</p>";
      }

      // Mostrar productos relacionados
      const productos = ServicioDatos.obtenerProductos();
      const contProductos = document.querySelector('#productos-relacionados .cuadricula-datos');
      const relacionadosP = productos.filter(p => p.entidades?.includes(entidad.nombre));

      if (relacionadosP.length > 0) {
        relacionadosP.forEach(p => {
          const div = document.createElement('div');
          div.className = 'elemento-datos';
          div.innerHTML = `
            <img src="${p.imagen}" alt="${p.nombre}">
            <a href="producto.html" onclick="verProducto('${p.nombre}')">${p.nombre}</a>
          `;
          contProductos.appendChild(div);
        });
      } else {
        contProductos.innerHTML = "<p>No hay productos relacionados.</p>";
      }
    }
  </script>
  <script src="js/navegacion.js"></script>

</body>
</html>
