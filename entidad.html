<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Detalle de la Entidad</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <header>
    <h1>Anales de la Ciencia</h1>
    <a href="index.html" class="boton-volver">← Volver</a>
  </header>

  <main class="pagina-producto" id="detalle-entidad"></main>

  <script src="js/navegacion.js"></script>
  <script>
    let entidad = null;

    // Modificado para la implementacion de la api
    async function mostrarEntidad() {
      entidad = await obtenerEntidadDesdeAPI();
      const contenedor = document.getElementById('detalle-entidad');
      const puedeEditar = localStorage.getItem("userRol") === "writer";

      if (!entidad) {
        contenedor.innerHTML = "<p>Entidad no encontrada.</p>";
        return;
      }

      contenedor.innerHTML = `
        <header class="cabecera-wiki">
          <h1 class="titulo-wiki">${entidad.name}</h1>
          <img src="${entidad.imageUrl}" alt="${entidad.name}" class="imagen-wiki" />
          ${puedeEditar ? `
          <div style="display: flex; flex-direction: column; gap: 0.5rem;">
          <button class="boton-editar" onclick="editarEntidadDesdeVista()">Editar datos</button>
          <button class="boton-editar" onclick="editarRelacionesEntidad()">Editar relaciones</button>
          </div>
        ` : ""}

        </header>

        <section class="datos-wiki">
          <table>
            <tr><th>Fecha de creación</th><td>${entidad.birthDate}</td></tr>
            <tr><th>Fecha de utilidad</th><td>${entidad.deathDate}</td></tr>
            <tr><th>Wiki</th><td><a href="${entidad.wikiUrl}" target="_blank">Ver en Wikipedia</a></td></tr>
          </table>
        </section>

        <section class="relacionados">
          <h2>Científicos Relacionados</h2>
          <div class="cuadricula-datos" id="cientificos-relacionados"></div>

          <h2>Productos Relacionados</h2>
          <div class="cuadricula-datos" id="productos-relacionados"></div>
          
          <h2>Asociaciones Relacionadas</h2>
          <div class="cuadricula-datos" id="asociaciones-relacionadas"></div>
        </section>
      `;

      if (entidad.persons?.length > 0) {
        entidad.persons.forEach(renderizarCientificoRelacionado);
      }

      if (entidad.products?.length > 0) {
        entidad.products.forEach(renderizarProductoRelacionado);
      }

      if (entidad.asociaciones?.length > 0) {
        entidad.asociaciones.forEach(renderizarAsociacionRelacionada);
      }

    }

    // Modificado para la implementacion de la api
    async function obtenerEntidadDesdeAPI() {
      const id = localStorage.getItem("entidadSeleccionada");
      if (!id) return null;

      const response = await fetch(`http://127.0.0.1:8000/api/v1/entities/${id}`);
      if (!response.ok) {
        console.error("Error al obtener la entidad por ID");
        return null;
      }

      const result = await response.json();
      return result.entity;
    }

    function editarEntidadDesdeVista() {
      localStorage.setItem("entidadEditando", entidad.name);
      window.location.href = "editar-entidad.html";
    }

    function editarRelacionesEntidad() {
      localStorage.setItem("entidadSeleccionada", entidad.id);
      window.location.href = "editar-relaciones-entidades.html";
    }


    mostrarEntidad();

    function verCientifico(id) {
      localStorage.setItem("cientificoSeleccionadoId", id);
    }

    function verProducto(id) {
      localStorage.setItem("productoSeleccionado", id);
    }

    //Bi-direccional
    function verAsociacion(id) {
      localStorage.setItem("asociacionSeleccionada", id);
    }

    async function renderizarCientificoRelacionado(id) {
      try {
        const res = await fetch(`http://127.0.0.1:8000/api/v1/persons/${id}`);
        const data = await res.json();
        const cientifico = data.person;

        const div = document.createElement("div");
        div.className = "elemento-datos";
        div.innerHTML = `
      <img src="${cientifico.imageUrl || 'img/default.jpg'}" alt="${cientifico.name}" />
      <a href="cientifico.html" onclick="verCientifico(${cientifico.id})">${cientifico.name}</a>
    `;
        document.getElementById("cientificos-relacionados").appendChild(div);
      } catch (error) {
        console.error(`Error al cargar científico ID ${id}:`, error);
      }
    }

    async function renderizarProductoRelacionado(id) {
      try {
        const res = await fetch(`http://127.0.0.1:8000/api/v1/products/${id}`);
        const data = await res.json();
        const producto = data.product;

        const div = document.createElement("div");
        div.className = "elemento-datos";
        div.innerHTML = `
      <img src="${producto.imageUrl || 'img/default.jpg'}" alt="${producto.name}" />
      <a href="producto.html" onclick="verProducto(${producto.id})">${producto.name}</a>
    `;
        document.getElementById("productos-relacionados").appendChild(div);
      } catch (error) {
        console.error(`Error al cargar producto ID ${id}:`, error);
      }
    }

    async function renderizarAsociacionRelacionada(id) {
      try {
        const res = await fetch(`http://127.0.0.1:8000/api/v1/asociaciones/${id}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        const asociacion = data.asociacion;

        const div = document.createElement("div");
        div.className = "elemento-datos";
        div.innerHTML = `
      <img src="${asociacion.imageUrl || 'img/default.jpg'}" alt="${asociacion.name}" />
      <a href="asociacion.html" onclick="verAsociacion(${asociacion.id})">${asociacion.name}</a>
    `;
        document.getElementById("asociaciones-relacionadas").appendChild(div);
      } catch (error) {
        console.error(`Error al cargar asociación ID ${id}:`, error);
      }
    }

  </script>
  <footer class="footer-ejemplo">
    <h2>Proyecto Front End David Lew Pérez 2025</h2>
  </footer>
</body>

</html>
