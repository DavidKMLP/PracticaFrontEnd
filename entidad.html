<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Detalle de la Entidad</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header>
    <h1>Anales de la Ciencia</h1>
    <a href="index.html" class="boton-volver">← Volver</a>
  </header>

  <main class="pagina-producto" id="detalle-entidad"></main>

  <script src="js/datosCentralizados.js"></script>
  <script src="js/navegacion.js"></script>
  <script>
    let entidad = null;

    async function mostrarEntidad() {
      entidad = await DatosApp.obtenerEntidadSeleccionada();
      const contenedor = document.getElementById('detalle-entidad');
      const sesion = JSON.parse(localStorage.getItem("usuarioLogueado"));
      const puedeEditar = sesion?.rol === "escritor";

      if (!entidad) {
        contenedor.innerHTML = "<p>Entidad no encontrada.</p>";
        return;
      }

      contenedor.innerHTML = `
        <header class="cabecera-wiki">
          <h1 class="titulo-wiki">${entidad.nombre}</h1>
          <img src="${entidad.imagen}" alt="${entidad.nombre}" class="imagen-wiki" />
          ${puedeEditar ? `<button class="boton-editar" onclick="editarEntidadDesdeVista()">Editar datos</button>` : ""}
        </header>

        <section class="descripcion-wiki">
          <p class="intro-wiki">${entidad.intro || ''}</p>
        </section>

        <section class="datos-wiki">
          <table>
            <tr><th>Fecha de creación</th><td>${entidad.fechaCreacion}</td></tr>
            <tr><th>Fecha de utilidad</th><td>${entidad.fechaUtilidad}</td></tr>
            <tr><th>Wiki</th><td><a href="${entidad.wiki}" target="_blank">Ver en Wikipedia</a></td></tr>
          </table>
        </section>

        <section class="relacionados">
          <h2>Científicos Relacionados</h2>
          <div class="cuadricula-datos" id="cientificos-relacionados"></div>

          <h2>Productos Relacionados</h2>
          <div class="cuadricula-datos" id="productos-relacionados"></div>
        </section>
      `;

      const cientificos = await DatosApp.obtenerCientificos();
      const productos = await DatosApp.obtenerProductos();
      const contCientificos = document.getElementById('cientificos-relacionados');
      const contProductos = document.getElementById('productos-relacionados');

      const relacionadosC = cientificos.filter(c => c.entidades?.includes(entidad.nombre));
      relacionadosC.length > 0
        ? relacionadosC.forEach(c => {
            const div = document.createElement("div");
            div.className = "elemento-datos";
            div.innerHTML = `
              <img src="${c.imagen}" alt="${c.nombre}" />
              <a href="cientifico.html" onclick="verCientifico('${c.nombre}')">${c.nombre}</a>
            `;
            contCientificos.appendChild(div);
          })
        : contCientificos.innerHTML = "<p>No hay científicos relacionados.</p>";

      const relacionadosP = productos.filter(p => p.entidades?.includes(entidad.nombre));
      relacionadosP.length > 0
        ? relacionadosP.forEach(p => {
            const div = document.createElement("div");
            div.className = "elemento-datos";
            div.innerHTML = `
              <img src="${p.imagen}" alt="${p.nombre}" />
              <a href="producto.html" onclick="verProducto('${p.nombre}')">${p.nombre}</a>
            `;
            contProductos.appendChild(div);
          })
        : contProductos.innerHTML = "<p>No hay productos relacionados.</p>";
    }

    function editarEntidadDesdeVista() {
      localStorage.setItem("entidadEditando", entidad.nombre);
      window.location.href = "editar-entidad.html";
    }

    mostrarEntidad();
  </script>
</body>
</html>
