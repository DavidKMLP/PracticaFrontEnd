<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Crear Entidad</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <header>
    <h1>Crear Entidad</h1>
    <a href="index.html" class="boton-volver">← Volver</a>
  </header>

  <main>
    <form id="formulario-crear-entidad" class="formulario">
      <label>Nombre: <input type="text" name="nombre" required /></label>
      <label>Fecha de creación: <input type="date" name="fechaCreacion" required /></label>
      <label>Fecha de utilidad: <input type="date" name="fechaUtilidad" required /></label>
      <label>Wikipedia (URL): <input type="url" name="wiki" required /></label>
      <label>Imagen (URL): <input type="url" name="imagen" required /></label>
      <button type="submit">Guardar Entidad</button>
    </form>
  </main>

  <script>
    const formulario = document.getElementById("formulario-crear-entidad");

    formulario.addEventListener("submit", async function (e) {
      e.preventDefault();

      const formData = new FormData(formulario);
      const token = localStorage.getItem("accessToken");

      const nuevaEntidad = {
        name: formData.get("nombre"),
        birthDate: formData.get("fechaCreacion"),
        deathDate: formData.get("fechaUtilidad"),
        wikiUrl: formData.get("wiki"),
        imageUrl: formData.get("imagen")
      };

      try {
        const response = await fetch("http://127.0.0.1:8000/api/v1/entities", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify(nuevaEntidad)
        });

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(errorText);
        }

        alert("Entidad creada correctamente.");
        window.location.href = "index.html";
      } catch (error) {
        alert("Error al crear la entidad.");
        console.error(error);
      }
    });
  </script>

  <footer class="footer-ejemplo">
    <h2>Proyecto Front End David Lew Pérez 2025</h2>
  </footer>
</body>

</html>
