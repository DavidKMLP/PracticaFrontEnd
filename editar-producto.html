<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Editar Producto</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <header>
    <h1>Editar Producto</h1>
    <a href="index.html" class="boton-volver">← Volver</a>
  </header>

  <main>
    <form id="formulario-editar-producto" class="formulario">
      <label>Nombre: <input type="text" name="nombre" required /></label>
      <label>Fecha de creación: <input type="date" name="fechaCreacion" required /></label>
      <label>Fecha de utilidad: <input type="date" name="fechaUtilidad" required /></label>
      <label>Wikipedia (URL): <input type="url" name="wiki" required /></label>
      <label>Imagen (URL): <input type="url" name="imagen" required /></label>
      <button type="submit">Guardar Cambios</button>
    </form>
  </main>

  <script src="js/datosCentralizados.js"></script>
  <script>
    const formulario = document.getElementById("formulario-editar-producto");

    let productoActual = null;
    let etagProducto = null; //necesario para hacer PUT

    async function cargarProducto() {
      const id = localStorage.getItem("productoEditandoId");
      if (!id) {
        alert("ID del producto no definido.");
        window.location.href = "index.html";
        return;
      }

      try {
        const response = await fetch(`http://127.0.0.1:8000/api/v1/products/${id}`);
        //if (!response.ok) throw new Error("No se pudo obtener el producto");

        etagProducto = response.headers.get("etag"); // Guarda el ETag
        const data = await response.json();
        productoActual = data.product;

        formulario.nombre.value = productoActual.name;
        formulario.fechaCreacion.value = productoActual.birthDate;
        formulario.fechaUtilidad.value = productoActual.deathDate;
        formulario.wiki.value = productoActual.wikiUrl;
        formulario.imagen.value = productoActual.imageUrl || "";
      } catch (error) {
        alert("Error al cargar el producto.");
        console.error(error);
        window.location.href = "index.html";
      }
    }

    formulario.addEventListener("submit", async function (e) {
      e.preventDefault();

      const formData = new FormData(formulario);
      const token = localStorage.getItem("accessToken");

      const updatedData = {
        name: formData.get("nombre"),
        birthDate: formData.get("fechaCreacion"),
        deathDate: formData.get("fechaUtilidad"),
        wikiUrl: formData.get("wiki"),
        imageUrl: formData.get("imagen")
      };

      try {
        const response = await fetch(`http://127.0.0.1:8000/api/v1/products/${productoActual.id}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`,
            "If-Match": etagProducto
          },
          body: JSON.stringify(updatedData)
        });

        if (!response.ok) {
          const msg = await response.text();
          throw new Error("Error al actualizar: " + msg);
        }

        alert("Producto actualizado correctamente.");
        window.location.href = "index.html";
      } catch (error) {
        console.error("Error al actualizar producto:", error);
        alert("No se pudo actualizar el producto. Revisa consola.");
      }
    });

    cargarProducto();
  </script>
</body>

</html>
