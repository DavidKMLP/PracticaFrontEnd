<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Editar Científico</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header>
    <h1>Editar Científico</h1>
    <a href="index.html" class="boton-volver">← Volver</a>
  </header>

  <main>
    <form id="formulario-editar-cientifico" class="formulario">
      <label>Nombre: <input type="text" name="nombre" required /></label>
      <label>Fecha de nacimiento: <input type="text" name="fechaCreacion" required /></label>
      <label>Fecha de fallecimiento: <input type="text" name="fechaUtilidad" required /></label>
      <label>Wikipedia (URL): <input type="url" name="wiki" required /></label>

      <label>Introducción:
        <textarea name="intro" rows="4" placeholder="Breve descripción..."></textarea>
      </label>

      <label>Entidades relacionadas (separadas por coma): <input type="text" name="entidades" /></label>
      <label>Imagen nueva (.jpg o .png, opcional): <input type="file" name="imagen" accept=".jpg,.jpeg,.png" /></label>

      <button type="submit">Guardar Cambios</button>
    </form>
  </main>

  <script src="js/datosCentralizados.js"></script>
  <script>
    const formulario = document.getElementById("formulario-editar-cientifico");
    let cientificoActual = null;

    async function cargarCientifico() {
      const nombre = localStorage.getItem("cientificoEditando");
      const cientificos = await DatosApp.obtenerCientificos();
      cientificoActual = cientificos.find(c => c.nombre === nombre);

      if (!cientificoActual) {
        alert("Científico no encontrado.");
        window.location.href = "index.html";
        return;
      }

      // Precargar datos en el formulario
      formulario.nombre.value = cientificoActual.nombre;
      formulario.fechaCreacion.value = cientificoActual.fechaCreacion;
      formulario.fechaUtilidad.value = cientificoActual.fechaUtilidad;
      formulario.wiki.value = cientificoActual.wiki;
      formulario.intro.value = cientificoActual.intro || "";
      formulario.entidades.value = cientificoActual.entidades?.join(", ") || "";
    }

    formulario.addEventListener("submit", async function (e) {
      e.preventDefault();
      const formData = new FormData(formulario);
      const archivoImagen = formData.get("imagen");

      const cientificos = await DatosApp.obtenerCientificos();
      const index = cientificos.findIndex(c => c.nombre === cientificoActual.nombre);

      const guardar = async (imagenNueva = cientificoActual.imagen) => {
        const actualizado = {
          nombre: formData.get("nombre"),
          fechaCreacion: formData.get("fechaCreacion"),
          fechaUtilidad: formData.get("fechaUtilidad"),
          wiki: formData.get("wiki"),
          intro: formData.get("intro"),
          imagen: imagenNueva,
          entidades: formData.get("entidades").split(',').map(e => e.trim()).filter(Boolean)
        };

        cientificos[index] = actualizado;
        const datos = await DatosApp.cargarDatos();
        datos.cientificos = cientificos;
        DatosApp.guardarDatos(datos);

        alert("Científico actualizado.");
        window.location.href = "index.html";
      };

      if (archivoImagen && archivoImagen.size > 0 && archivoImagen.type.startsWith("image/")) {
        const reader = new FileReader();
        reader.onload = () => guardar(reader.result);
        reader.readAsDataURL(archivoImagen);
      } else {
        await guardar();
      }
    });

    cargarCientifico();
  </script>
</body>
</html>
