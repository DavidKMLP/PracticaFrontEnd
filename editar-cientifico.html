<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Editar Científico</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header>
    <h1>Editar Científico</h1>
    <a href="index.html" class="boton-volver">← Volver</a>
  </header>

  <main>
    <form id="formulario-editar-cientifico" class="formulario">
      <label>Nombre: <input type="text" name="nombre" required /></label>
      <label>Fecha de nacimiento: <input type="date" name="fechaNacimiento" required /></label>
      <label>Fecha de fallecimiento: <input type="date" name="fechaFallecimiento" required /></label>
      <label>Wikipedia (URL): <input type="url" name="wiki" required /></label>
      <label>Imagen (URL): <input type="url" name="imagen" required /></label>
      <button type="submit">Guardar Cambios</button>
    </form>
  </main>

  <script>
    const formulario = document.getElementById("formulario-editar-cientifico");
    let cientificoActual = null;
    let etagCientifico = null;

    async function cargarCientifico() {
      const id = localStorage.getItem("cientificoSeleccionadoId");
      if (!id) {
        alert("ID del científico no definido.");
        window.location.href = "index.html";
        return;
      }

      try {
        const response = await fetch(`http://127.0.0.1:8000/api/v1/persons/${id}`);
        if (!response.ok) throw new Error("No se pudo obtener el científico");
        etagCientifico = response.headers.get("etag");
        const data = await response.json();
        cientificoActual = data.person;

        formulario.nombre.value = cientificoActual.name;
        formulario.fechaNacimiento.value = cientificoActual.birthDate;
        formulario.fechaFallecimiento.value = cientificoActual.deathDate;
        formulario.wiki.value = cientificoActual.wikiUrl;
        formulario.imagen.value = cientificoActual.imageUrl || "";

      } catch (error) {
        alert("Error al cargar los datos del científico.");
        console.error(error);
        window.location.href = "index.html";
      }
    }

    formulario.addEventListener("submit", async function (e) {
      e.preventDefault();

      const formData = new FormData(formulario);
      const token = localStorage.getItem("accessToken");

      const actualizado = {
        name: formData.get("nombre"),
        birthDate: formData.get("fechaNacimiento"),
        deathDate: formData.get("fechaFallecimiento"),
        wikiUrl: formData.get("wiki"),
        imageUrl: formData.get("imagen")
      };

      try {
        const response = await fetch(`http://127.0.0.1:8000/api/v1/persons/${cientificoActual.id}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`,
            "If-Match": etagCientifico
          },
          body: JSON.stringify(actualizado)
        });

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(errorText);
        }

        alert("Científico actualizado correctamente.");
        window.location.href = "index.html";
      } catch (error) {
        alert("Error al actualizar el científico.");
        console.error(error);
      }
    });

    cargarCientifico();
  </script>

  <footer class="footer-ejemplo">
    <h2>Proyecto Front End David Lew Pérez 2025</h2>
  </footer>
</body>
</html>
