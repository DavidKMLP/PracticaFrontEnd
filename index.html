<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anales de la Ciencia</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header>
        <h1>Anales de la Ciencia</h1>
        <form id="formulario-inicio-sesion" class="formulario-inicio-sesion">
            <div class="grupo-formulario">
                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" name="usuario" required>
            </div>
            <div class="grupo-formulario">
                <label for="contrasena">Contraseña:</label>
                <input type="password" id="contrasena" name="contrasena" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <div id="contenedor-logout" class="formulario-inicio-sesion" style="display: none;">
            <button id="boton-cerrar-sesion">Logout</button>
        </div>
    </header>

    <!-- Vista normal -->
    <div id="vista-usuario-normal">
        <main>
            <!-- Sección de Inventos -->
            <section class="seccion-datos">
                <h2>Productos</h2>
                <div class="cuadricula-datos">
                    <div class="elemento-datos">
                        <img src="https://via.placeholder.com/50" alt="Ícono CSS">
                        <a href="producto.html" onclick="verProducto('CSS'); return true;">CSS</a>

                    </div>
                    <div class="elemento-datos">
                        <img src="https://via.placeholder.com/50" alt="Ícono JavaScript">
                        <a href="producto.html" onclick="verProducto('JavaScript'); return true;">JavaScript</a>
                    </div>
                </div>
            </section>

            <!-- Sección de Científicos -->
            <section class="seccion-datos">
                <h2>Científicos</h2>
                <div class="cuadricula-datos">
                    <div class="elemento-datos">
                        <img src="https://via.placeholder.com/50" alt="Cientifico1">
                        <a href="#" onclick="verCientifico('Alan Turing')">Alan Turing</a>
                    </div>
            </section>

            <!-- Sección de Entidades -->
            <section class="seccion-datos">
                <h2>Entidades</h2>
                <div class="cuadricula-datos">
                    <div class="elemento-datos">
                        <img src="https://via.placeholder.com/50" alt="Logo IBM">
                        <span>IBM</span>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Vista de Lector -->
    <div id="vista-lector" style="display: none;">
        <main>
            <!-- Sección de Inventos -->
            <section class="seccion-datos">
                <h2>Productos</h2>
                <div class="cuadricula-datos">
                    <div class="elemento-datos">
                        <img src="https://via.placeholder.com/50" alt="Ícono CSS">
                        <span>CSS</span>
                    </div>
                    <div class="elemento-datos">
                        <img src="https://via.placeholder.com/50" alt="Ícono JavaScript">
                        <span>JavaScript</span>
                    </div>
                </div>
            </section>

            <!-- Sección de Científicos -->
            <section class="seccion-datos">
                <h2>Científicos</h2>
                <div class="cuadricula-datos">
                    <div class="elemento-datos">
                        <img src="https://via.placeholder.com/50" alt="Cientifico1">
                        <span>Cientifico1</span>
                    </div>
                </div>
            </section>

            <!-- Sección de Entidades -->
            <section class="seccion-datos">
                <h2>Entidades</h2>
                <div class="cuadricula-datos">
                    <div class="elemento-datos">
                        <img src="https://via.placeholder.com/50" alt="Logo IBM">
                        <span>IBM</span>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Vista de Escritor -->
    <div id="vista-escritor" style="display: none;">
        <main>
            <!-- Sección de Inventos -->
            <section class="seccion-datos">
                <h2>Productos</h2>
                <div class="cuadricula-datos">
                    <div class="elemento-datos">
                        <img src="https://via.placeholder.com/50" alt="Ícono CSS">
                        <span>CSS</span>
                        <button class="boton-eliminar">delete</button>
                    </div>
                    <div class="elemento-datos">
                        <img src="https://via.placeholder.com/50" alt="Ícono JavaScript">
                        <span>JavaScript</span>
                        <button class="boton-eliminar">delete</button>
                    </div>
                </div>
                <button class="boton-crear">create</button>
            </section>

            <!-- Sección de Científicos -->
            <section class="seccion-datos">
                <h2>Científicos</h2>
                <div class="cuadricula-datos">
                    <div class="elemento-datos">
                        <img src="https://via.placeholder.com/50" alt="Cientifico1">
                        <span>Cientifico1</span>
                        <button class="boton-eliminar">delete</button>
                    </div>
                </div>
                <button class="boton-crear">create</button>
            </section>

            <!-- Sección de Entidades -->
            <section class="seccion-datos">
                <h2>Entidades</h2>
                <div class="cuadricula-datos">
                    <div class="elemento-datos">
                        <img src="https://via.placeholder.com/50" alt="Logo IBM">
                        <span>IBM</span>
                        <button class="boton-eliminar">delete</button>
                    </div>
                </div>
                <button class="boton-crear">create</button>
            </section>
        </main>
    </div>

    <script src="js/main.js"></script>
    <script src="js/datos.js"></script>
    <script src="js/productos.js"></script>
    <script src="js/cientificos.js"></script>
    <script>
        if (ServicioDatos.obtenerProductos().length === 0) {
            ServicioDatos.guardarProductos(productos);
        }

        if (ServicioDatos.obtenerCientificos().length === 0) {
            ServicioDatos.guardarCientificos(cientificos);
        }

        function verProducto(nombre) {
            const producto = ServicioDatos.obtenerProductoPorNombre(nombre);
            if (producto) {
                ServicioDatos.guardarProductoSeleccionado(producto);
            }
        }

        function verCientifico(nombre) {
            const cientifico = ServicioDatos.obtenerCientificoPorNombre(nombre);
            if (cientifico) {
                ServicioDatos.guardarCientificoSeleccionado(cientifico);
                window.location.href = "cientifico.html";
            }
        }
    </script>
</body>

</html>
