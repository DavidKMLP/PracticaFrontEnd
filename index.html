<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anales de la Ciencia</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header>
    <h1>Anales de la Ciencia</h1>

    <form id="formulario-inicio-sesion" class="formulario-inicio-sesion">
      <div class="grupo-formulario">
        <label for="usuario">Usuario:</label>
        <input type="text" id="usuario" name="usuario" required />
      </div>
      <div class="grupo-formulario">
        <label for="contrasena">Contraseña:</label>
        <input type="password" id="contrasena" name="contrasena" required />
      </div>
      <button type="submit">Login</button>
    </form>

    <div id="contenedor-logout" class="formulario-inicio-sesion" style="display: none;">
      <button id="boton-cerrar-sesion">Logout</button>
    </div>
  </header>

  <!-- Vista usuario normal -->
  <div id="vista-usuario-normal">
    <main>
      <section class="seccion-datos">
        <h2>Productos</h2>
        <div class="cuadricula-datos" id="contenedor-productos-normal"></div>
      </section>

      <section class="seccion-datos">
        <h2>Científicos</h2>
        <div class="cuadricula-datos" id="contenedor-cientificos-normal"></div>
      </section>

      <section class="seccion-datos">
        <h2>Entidades</h2>
        <div class="cuadricula-datos" id="contenedor-entidades-normal"></div>
      </section>
    </main>
  </div>

  <!-- Vista lector -->
  <div id="vista-lector" style="display: none;">
    <main>
      <section class="seccion-datos">
        <h2>Productos</h2>
        <div class="cuadricula-datos" id="contenedor-productos-lector"></div>
      </section>

      <section class="seccion-datos">
        <h2>Científicos</h2>
        <div class="cuadricula-datos" id="contenedor-cientificos-lector"></div>
      </section>

      <section class="seccion-datos">
        <h2>Entidades</h2>
        <div class="cuadricula-datos" id="contenedor-entidades-lector"></div>
      </section>
    </main>
  </div>

  <!-- Vista escritor -->
  <div id="vista-escritor" style="display: none;">
    <main>
      <section class="seccion-datos">
        <h2>Productos</h2>
        <div class="cuadricula-datos" id="contenedor-productos-escritor"></div>
        <a href="crear-producto.html" class="boton-crear">create</a>
      </section>

      <section class="seccion-datos">
        <h2>Científicos</h2>
        <div class="cuadricula-datos" id="contenedor-cientificos-escritor"></div>
        <a href="crear-cientifico.html" class="boton-crear">create</a>
      </section>

      <section class="seccion-datos">
        <h2>Entidades</h2>
        <div class="cuadricula-datos" id="contenedor-entidades-escritor"></div>
        <a href="crear-entidad.html" class="boton-crear">create</a>
      </section>
    </main>
  </div>

  <script src="js/datosCentralizados.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
