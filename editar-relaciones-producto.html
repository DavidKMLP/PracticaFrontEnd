<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editar Relaciones</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header>
    <h1>Editar Relaciones</h1>
    <a href="index.html" class="boton-volver">&larr; Volver</a>
  </header>

  <main class="formulario">
    <section id="bloque-datos">
      <p><strong>Producto:</strong> <span id="nombre-elemento"></span></p>

      <div class="seccion-datos">
        <h3>Personas relacionadas actualmente:</h3>
        <ul id="lista-personas"></ul>

        <label>Agregar personas:
          <select id="select-personas">
            <option value="">-- Ninguna --</option>
          </select>
        </label>
      </div>

      <div class="seccion-datos">
        <h3>Entidades relacionadas actualmente:</h3>
        <ul id="lista-entidades"></ul>

        <label>Agregar entidades:
          <select id="select-entidades">
            <option value="">-- Ninguna --</option>
          </select>
        </label>
      </div>

      <div class="seccion-datos">
        <label>Tipo de operación:
          <select id="tipo-operacion">
            <option value="add">Añadir relación</option>
            <option value="rem">Eliminar relación</option>
          </select>
        </label>
      </div>

      <button id="btn-guardar">Aplicar operación</button>
    </section>
  </main>

  <script>
    const tipo = localStorage.getItem("relacionTipo");
    const id = localStorage.getItem("relacionId");
    const token = localStorage.getItem("accessToken");

    const nombreElemento = document.getElementById("nombre-elemento");
    const listaPersonas = document.getElementById("lista-personas");
    const listaEntidades = document.getElementById("lista-entidades");
    const selectPersonas = document.getElementById("select-personas");
    const selectEntidades = document.getElementById("select-entidades");
    const tipoOperacion = document.getElementById("tipo-operacion");
    const btnGuardar = document.getElementById("btn-guardar");

    let relacionesActuales = { persons: [], entities: [] };

    async function cargarDatos() {
      try {
        const response = await fetch(`http://127.0.0.1:8000/api/v1/products/${id}`);
        const data = await response.json();
        nombreElemento.textContent = data.product.name;
        relacionesActuales = data.product;

        data.product.persons?.forEach(id => {
          const li = document.createElement("li");
          li.textContent = `ID ${id}`;
          listaPersonas.appendChild(li);
        });

        data.product.entities?.forEach(id => {
          const li = document.createElement("li");
          li.textContent = `ID ${id}`;
          listaEntidades.appendChild(li);
        });

      } catch (error) {
        alert("Error al cargar el producto actual");
        console.error(error);
      }
    }

    async function cargarOpciones(url, select, tipoRelacion) {
      try {
        const response = await fetch(url);
        const data = await response.json();
        const lista = tipoRelacion === 'persons' ? data.persons : data.entities;
        lista.forEach(item => {
          const el = tipoRelacion === 'persons' ? item.person : item.entity;
          const option = document.createElement("option");
          option.value = el.id;
          option.textContent = el.name;
          select.appendChild(option);
        });
      } catch (e) {
        console.error(`Error al cargar ${tipoRelacion}:`, e);
      }
    }

    btnGuardar.addEventListener("click", async function () {
      const personaId = parseInt(selectPersonas.value);
      const entidadId = parseInt(selectEntidades.value);
      const operacion = tipoOperacion.value;

      const acciones = [];
      if (!isNaN(personaId)) {
        acciones.push(fetch(`http://127.0.0.1:8000/api/v1/products/${id}/persons/${operacion}/${personaId}`, {
          method: "PUT",
          headers: { "Authorization": `Bearer ${token}` }
        }));
      }
      if (!isNaN(entidadId)) {
        acciones.push(fetch(`http://127.0.0.1:8000/api/v1/products/${id}/entities/${operacion}/${entidadId}`, {
          method: "PUT",
          headers: { "Authorization": `Bearer ${token}` }
        }));
      }

      if (acciones.length === 0) {
        alert("No se ha seleccionado ninguna persona ni entidad para aplicar la operación.");
        return;
      }

      try {
        await Promise.all(acciones);
        alert("Operación completada correctamente.");
        window.location.href = "index.html";
      } catch (e) {
        alert("Error al procesar la operación de relaciones");
        console.error(e);
      }
    });

    cargarDatos().then(() => {
      cargarOpciones("http://127.0.0.1:8000/api/v1/persons", selectPersonas, "persons");
      cargarOpciones("http://127.0.0.1:8000/api/v1/entities", selectEntidades, "entities");
    });
  </script>

  <footer class="footer-ejemplo">
    <h2>Proyecto Front End David Lew Pérez 2025</h2>
  </footer>
</body>
</html>
